{% extends "proctoring/teacher/base.html" %}
{% block title %}ExamProctor{% endblock %}
{% block content %}
<div style="max-width:560px;margin:60px auto 0;text-align:center">
  <h1 style="font-size:2.2rem">ExamProctor</h1>
  <p class="muted" style="font-size:1.05rem">Exam server is running.</p>
  <p style="margin-top:28px"><a class="btn primary" href="{% url 'teacher-exams' %}">Teacher log in</a></p>
  {% if download_url %}
  <p style="margin-top:14px"><a class="btn" href="{{ download_url }}" rel="noopener">Download the student app (Mac)</a></p>
  {% endif %}
</div>
{% endblock %}
