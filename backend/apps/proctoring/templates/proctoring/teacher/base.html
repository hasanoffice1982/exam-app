<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Exam dashboard{% endblock %}</title>
  <style>
    :root {
      --bg:#f3f7f6; --card:#fff; --text:#0f172a; --muted:#64748b; --line:#e2e8f0; --hover:#f8fafc;
      --brand:#0d9488; --brand-soft:#e6f6f3; --ok:#059669; --ok-bg:#ecfdf5; --warn:#d97706; --warn-bg:#fffbeb;
      --bad:#dc2626; --bad-bg:#fef2f2; --idle:#64748b; --idle-bg:#f1f5f9; --shadow:0 1px 2px rgb(15 23 42/.06),0 4px 16px rgb(15 23 42/.04);
    }
    @media (prefers-color-scheme: dark) { :root {
      --bg:#0c1615; --card:#132120; --text:#e6f0ee; --muted:#93a8a4; --line:#223533; --hover:#182b29;
      --brand:#2dd4bf; --brand-soft:#123532; --ok:#34d399; --ok-bg:#0f2a24; --warn:#fbbf24; --warn-bg:#2b230f;
      --bad:#f87171; --bad-bg:#2d1518; --idle:#94a3b8; --idle-bg:#1a2c2a; --shadow:none; } }
    * { box-sizing:border-box; }
    body { margin:0; font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif; background:var(--bg); color:var(--text); }
    a { color:var(--brand); text-decoration:none; } a:hover { text-decoration:underline; }
    .nav { position:sticky; top:0; z-index:10; display:flex; align-items:center; justify-content:space-between; gap:16px; padding:0 28px; height:58px;
           background:var(--card); border-bottom:1px solid var(--line); }
    .brand { display:flex; align-items:center; gap:10px; font-weight:700; color:var(--text); }
    .brand i { width:28px; height:28px; border-radius:8px; background:linear-gradient(135deg,#0f766e,#14b8a6); display:inline-block; }
    .nav-right { display:flex; align-items:center; gap:14px; color:var(--muted); font-size:.9rem; }
    .nav-right form { margin:0; }
    main { max-width:1280px; margin:0 auto; padding:28px 28px 60px; }
    h1 { font-size:1.6rem; line-height:1.2; margin:0 0 4px; letter-spacing:-.01em; } h2 { font-size:1.1rem; margin:28px 0 8px; }
    .muted { color:var(--muted); font-size:.9rem; }
    .crumb { margin:0 0 12px; font-size:.9rem; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); overflow:hidden; }
    .card.pad { padding:20px; }
    .scroll { overflow-x:auto; }
    table { width:100%; border-collapse:collapse; }
    th { position:sticky; top:0; background:var(--card); text-align:left; padding:11px 12px; font-size:.75rem; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); border-bottom:1px solid var(--line); white-space:nowrap; }
    td { padding:11px 12px; border-bottom:1px solid var(--line); font-size:.92rem; white-space:nowrap; vertical-align:middle; }
    tbody tr:last-child td { border-bottom:0; } tbody tr:hover { background:var(--hover); }
    td.empty { text-align:center; color:var(--muted); padding:40px; }
    .pill { display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:999px; font-size:.78rem; font-weight:600; background:var(--idle-bg); color:var(--idle); }
    .pill::before { content:""; width:7px; height:7px; border-radius:50%; background:currentColor; }
    .pill.clean,.pill.online { background:var(--ok-bg); color:var(--ok); } .pill.review,.pill.offline { background:var(--warn-bg); color:var(--warn); }
    .pill.flagged { background:var(--bad-bg); color:var(--bad); } .pill.ended { background:var(--idle-bg); color:var(--idle); }
    .person { display:flex; align-items:center; gap:12px; } .person a { font-weight:600; color:var(--text); } .person small { display:block; color:var(--muted); }
    .avatar { width:34px; height:34px; border-radius:50%; display:grid; place-items:center; font-weight:700; font-size:.8rem; color:#fff; background:#0d9488; flex:none; }
    .num { font-variant-numeric:tabular-nums; } .num.hot { color:var(--bad); font-weight:700; }
    .btn, button { font:inherit; font-size:.85rem; font-weight:600; padding:7px 12px; border-radius:9px; border:1px solid var(--line); background:var(--card); color:var(--text); cursor:pointer; text-decoration:none; display:inline-block; }
    .btn:hover, button:hover { border-color:var(--brand); text-decoration:none; }
    .btn.primary, button.primary { background:var(--brand); color:#fff; border-color:var(--brand); }
    button.danger { color:var(--bad); border-color:color-mix(in srgb,var(--bad) 40%,var(--line)); } button.danger:hover { background:var(--bad-bg); border-color:var(--bad); }
    .actions { display:flex; gap:6px; flex-wrap:wrap; max-width:330px; }
    .toolbar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:18px 0 14px; }
    .toolbar .spacer { flex:1; }
    .chips { display:flex; gap:6px; flex-wrap:wrap; } .chip { padding:6px 13px; border-radius:999px; border:1px solid var(--line); background:var(--card); font-size:.85rem; font-weight:600; color:var(--muted); cursor:pointer; }
    .chip.active { background:var(--brand-soft); border-color:var(--brand); color:var(--brand); }
    input[type=search], input[type=text], input[type=url], input[type=number], input[type=password], input[type=datetime-local], textarea, select { font:inherit; padding:8px 12px; border:1px solid var(--line); border-radius:9px; background:var(--card); color:var(--text); min-width:220px; }
    form .field input[type=text], form .field input[type=url], form .field input[type=number], form .field input[type=password], form .field input[type=datetime-local], form .field textarea, form .field select { width:100%; max-width:560px; }
    .settings-grid .field input[type=text], .settings-grid .field input[type=url], .settings-grid .field input[type=number], .settings-grid .field input[type=datetime-local], .settings-grid .field textarea { max-width:none; }
    input[type=checkbox] { accent-color:var(--brand); width:18px; height:18px; }
    input[type=file] { font:inherit; max-width:100%; }
    input:focus, select:focus { outline:2px solid var(--brand); outline-offset:1px; }
    .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; margin-top:20px; }
    .tile { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px 18px; box-shadow:var(--shadow); }
    .tile b { display:block; font-size:1.9rem; line-height:1.1; font-variant-numeric:tabular-nums; } .tile span { color:var(--muted); font-size:.85rem; }
    .tile.ok b { color:var(--ok); } .tile.warn b { color:var(--warn); } .tile.bad b { color:var(--bad); }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:16px; margin-top:20px; }
    .exam-card { display:block; padding:20px; color:var(--text); } .exam-card:hover { text-decoration:none; border-color:var(--brand); }
    .exam-card h3 { margin:0 0 2px; font-size:1.1rem; } .exam-card .stats { display:flex; gap:22px; margin-top:16px; } .exam-card .stats b { display:block; font-size:1.4rem; }
    .timeline { list-style:none; margin:0; padding:8px 24px; position:relative; }
    .timeline li { position:relative; padding:14px 0 14px 28px; border-bottom:1px solid var(--line); } .timeline li:last-child { border-bottom:0; }
    .timeline li::before { content:""; position:absolute; left:0; top:21px; width:10px; height:10px; border-radius:50%; background:var(--line); border:2px solid var(--muted); }
    .timeline li.event.weighted::before { background:var(--warn); border-color:var(--warn); } .timeline li.shot::before { background:var(--brand); border-color:var(--brand); }
    .timeline time { color:var(--muted); font-variant-numeric:tabular-nums; margin-right:8px; }
    .timeline img { display:block; margin-top:10px; width:min(460px,100%); border:1px solid var(--line); border-radius:10px; }
    .weight { margin-left:6px; padding:1px 8px; border-radius:999px; background:var(--warn-bg); color:var(--warn); font-size:.78rem; font-weight:700; }
    .flash { margin:0 0 16px; padding:11px 16px; border-radius:10px; border:1px solid var(--line); background:var(--card); font-weight:600; }
    .flash.success { color:var(--ok); background:var(--ok-bg); border-color:transparent; } .flash.error { color:var(--bad); background:var(--bad-bg); border-color:transparent; }
    .settings-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(420px,1fr)); gap:16px; align-items:start; }
    .settings-grid h2 { margin:0 0 14px; font-size:1.05rem; }
    .errorlist { color:var(--bad); list-style:none; padding:0; margin:6px 0; font-size:.9rem; }
    .field { margin-bottom:16px; } .field label { display:block; font-weight:600; margin-bottom:6px; }
    @media (max-width:700px) { .nav, main { padding-left:16px; padding-right:16px; } }
  </style>
</head>
<body>
  <nav class="nav">
    <a class="brand" href="{% url 'teacher-exams' %}"><i></i>Exam dashboard</a>
    <div class="nav-right">
      {% if request.user.is_authenticated %}
        <span>{{ request.user.get_username }}</span>
        <form method="post" action="{% url 'teacher-logout' %}">{% csrf_token %}<button>Log out</button></form>
      {% else %}
        <a class="btn" href="{% url 'teacher-login' %}">Log in</a>
      {% endif %}
    </div>
  </nav>
  <main>
    {% for message in messages %}<div class="flash {{ message.tags }}" role="status">{{ message }}</div>{% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
