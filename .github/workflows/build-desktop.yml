name: Build desktop installers

on:
  workflow_dispatch:
    inputs:
      backend_url:
        description: Backend URL baked into the installer (no trailing slash)
        required: true
        default: https://hasan082.pythonanywhere.com
      release_tag:
        description: Publish the installers as a GitHub Release with this tag (e.g. v0.1.0). Leave empty to skip.
        required: false
        default: ""

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build:win
            artifact: ExamProctor-windows
            files: desktop/dist/*.exe
          - os: macos-latest
            script: build:mac
            artifact: ExamProctor-mac
            files: desktop/dist/*.dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Write .env (baked into the installer)
        shell: bash
        run: echo "BACKEND_URL=${{ inputs.backend_url }}" > .env
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    needs: build
    if: ${{ inputs.release_tag != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          gh release create "$TAG" installers/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "ExamProctor $TAG" \
            --notes "Windows: ExamProctor Setup .exe. Mac: ExamProctor .dmg. Backend: ${{ inputs.backend_url }}"
